spring.application.name=job-management

# H2 is used for local development. Data is reset when the application restarts.
spring.datasource.url=jdbc:h2:mem:jobmanagementdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Development-only signing key. Set APP_JWT_SECRET to a strong secret outside local development.
app.jwt.secret=${APP_JWT_SECRET:local-development-signing-key-change-this-before-deployment-2026}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
